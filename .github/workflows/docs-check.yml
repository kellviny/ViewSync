name: Documentation & Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-docs-and-types:
    name: Validate Docs Sync & TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Documentation (.md) Sync
        run: npm run check:docs

      - name: Validate TypeScript Types
        run: npm run typecheck --workspace=view-sync-desktop
